[project]
name = "photo-share-app"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.120.4",
    "uvicorn[standard]>=0.38.0",
]

[dependency-groups]
lint = [
    "black>=25.9.0",
    "pre-commit>=4.3.0",
    "ruff>=0.14.3",
]

[tool.black]
line-length = 88

target-version = ["py312"]

[tool.ruff]
line-length = 88
indent-width = 4

target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "B904"]

[tool.ruff.format]
quote-style = "double"
